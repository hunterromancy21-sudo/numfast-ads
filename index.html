<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NumFast - Speed Mental Math</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 10px;
        }
        .main-container {
            max-width: 420px;
            width: 100%;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title-text {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
        }
        .subtitle-text {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: 600;
        }
        /* تصغير الصورة باش تدخل مريحة في شاشة التليفون */
        .screenshot-img {
            max-width: 180px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 2px solid #38bdf8;
        }
        p {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn-download {
            display: inline-block;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            width: 100%;
            max-width: 260px;
        }
        .footer {
            margin-top: 10px;
            font-size: 10px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="title-text">NumFast</div>
        <div class="subtitle-text">Speed Mental Math</div>

        <img src="image_3.png" alt="NumFast Gameplay Promotion" class="screenshot-img">

        <p>Challenge your brain with the ultimate fast-paced mental math puzzle game! Download now and start the experience.</p>
        
        <a href="https://play.google.com/store/apps/details?id=com.numfast.gaming" class="btn-download">
            Download on Google Play 🚀
        </a>
        
        <div class="footer">&copy; 2026 Numfast. All rights reserved.</div>
    </div>

</body>
</html>
