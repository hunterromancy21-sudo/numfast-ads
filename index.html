<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NumFast - Speed Mental Math</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* منع التمرير نهائياً */
            text-align: center;
            padding: 10px;
        }
        .main-container {
            max-width: 380px;
            width: 100%;
            background: #1e293b;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title-text {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }
        /* تصغير الصورة باش تدخل مريحة وما تقطعش */
        .screenshot-img {
            max-width: 150px;
            height: auto;
            border-radius: 10px;
            margin: 8px 0;
            border: 2px solid #38bdf8;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        p {
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .btn-download {
            display: inline-block;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
            width: 100%;
            max-width: 240px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="title-text">NumFast</div>
        
        <img src="image_3.png" alt="NumFast Gameplay Promotion" class="screenshot-img">

        <p>Challenge your brain with fast mental math! Download now and start the experience.</p>
        
        <a href="https://play.google.com/store/apps/details?id=com.numfast.gaming" class="btn-download">
            Download on Google Play 🚀
        </a>
    </div>

</body>
</html>
