<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numfast - Fast Math Puzzle Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 2px solid #38bdf8;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #f8fafc;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-download {
            display: inline-block;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="YOUR_GAME_LOGO_URL.png" alt="Numfast Logo" class="logo">
        
        <h1>Numfast</h1>
        <p>تحدى عقلك مع أقوى لعبة حساب سريع وألغاز ذكية! هل يمكنك تجاوز المراحل الصعبة؟ حمّل اللعبة الآن وابدأ التحدي.</p>
        
        <a href="https://play.google.com/store/apps/details?id=YOUR_PACKAGE_NAME" class="btn-download">
            تحميل من Google Play 🚀
        </a>
    </div>

    <div class="footer">
        &copy; 2026 Numfast. All rights reserved.
    </div>

</body>
</html>
