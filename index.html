<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NumFast - Math Game</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2MCC94SWMG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-2MCC94SWMG');
    </script>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; /* خلفية كحلة */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh; /* هادي كتخلي الصفحة تاخد قياس شاشة التليفون بالضبط */
        }
        
        h1 {
            font-size: 26px;
            margin: 10px 0;
            text-align: center;
            letter-spacing: 1px;
        }

        .image-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 0;
        }

        .game-image {
            max-width: 90%;
            max-height: 55vh; /* هادي باش الصورة تاخد غي 55% من الشاشة والبوطونة تبقى باينة */
            object-fit: contain;
            border: 3px solid #ffffff; /* الإطار الأبيض */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .download-btn {
            margin-bottom: 20px; /* كتهز البوطونة شوية من التحت باش تبان مزيان */
            transition: transform 0.2s ease-in-out;
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        .download-btn img {
            width: 200px; /* قياس مناسب للتليفون */
        }
    </style>
</head>
<body>

    <h1>NumFast - Math Game</h1>
    
    <div class="image-container">
        <img src="image_3.png" alt="NumFast Game" class="game-image">
    </div>
    
    <a href="https://play.google.com/store/apps/details?id=com.numfast.gaming" class="download-btn">
        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
    </a>

</body>
</html>
