<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numfast - Fast Mental Math</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .main-container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Logo and Title Styling */
        .header-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 60px;
            height: auto;
        }
        .title-text {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }
        .subtitle-text {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: -10px; /* تقليل المسافة مع الصورة */
        }

        /* The Game Screenshot */
        .screenshot-img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 3px solid #38bdf8;
        }

        /* Description Paragraph */
        p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
            max-width: 400px;
        }

        /* Download Button */
        .btn-download {
            display: inline-block;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            max-width: 300px;
        }
        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.7);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header-section">
            <img src="numfast_logo.png" alt="Numfast Logo" class="logo-icon">
            <span class="title-text">NumFast</span>
        </div>
        
        <p class="subtitle-text">Speed Mental Math</p>
        <br>

        <img src="image_3.png" alt="NumFast Gameplay Promotion" class="screenshot-img">

        <p>تحدى عقلك مع أقوى لعبة حساب سريع وألغاز ذكية! هل يمكنك تجاوز جميع المراحل والوصول لـ Level 30؟ حمّل اللعبة الآن وابدأ المتعة والتجربة.</p>
        
        <a href="https://play.google.com/store/apps/details?id=YOUR_PACKAGE_NAME" class="btn-download">
            تحميل من Google Play الآن 🚀
        </a>
    </div>

    <div class="footer">
        &copy; 2026 Numfast. All rights reserved.
    </div>

</body>
</html>
